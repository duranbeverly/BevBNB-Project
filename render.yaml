# One-click deploy on Render's free plan. The database lives on Neon (free Postgres
# that never expires); paste its connection string into DATABASE_URL when Render asks.
services:
  - type: web
    name: bevbnb
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      npm run render-postbuild &&
      npm run build &&
      npm run sequelize --prefix backend db:migrate &&
      npm run sequelize --prefix backend db:seed:all
    startCommand: npm start
    healthCheckPath: /api/spots
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SCHEMA
        value: bevbnb_schema
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "604800"
      - key: DATABASE_URL
        sync: false
